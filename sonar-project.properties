# SonarCloud Project Configuration

# --- REQUIRED ---
# You can find these values on your SonarCloud project dashboard.
# Replace 'your-github-username_your-repo-name' with your actual project key.
sonar.projectKey=jaygasi

# Replace 'your-github-username' with your actual organization key.
sonar.organization=jaygasi

# --- PROJECT SETUP ---
# The root of the source code to be analyzed. '.' means the current directory.
sonar.sources=.

# The encoding of the source code.
sonar.sourceEncoding=UTF-8

# --- PYTHON SPECIFIC ---
# Tells SonarQube which version of Python you are using.
sonar.python.version=3.12

# (Optional but Recommended) Path to the code coverage report.
# You would generate this with a tool like 'pytest-cov'.
# sonar.python.coverage.reportPaths=coverage.xml